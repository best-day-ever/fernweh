<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="title desc">
  <title id="title">Fernweh — your workstation, wherever you work</title>
  <desc id="desc">A blue path connects a studio workstation to a laptop and a second display, on a dark blue background.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#142330"/><stop offset="1" stop-color="#0c141e"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#234d67"/><stop offset="1" stop-color="#152c40"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#89c9ed" stroke-opacity=".055"/>
    </pattern>
  </defs>
  <rect width="1280" height="340" rx="20" fill="url(#background)"/>
  <rect width="1280" height="340" rx="20" fill="url(#grid)"/>
  <g font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="66" y="67" fill="#89b7cc" font-size="12" letter-spacing="3">BEST DAY EVER · BUILT ON PLANK</text>
    <text x="62" y="159" fill="#f4f7fa" font-weight="700" font-size="82" letter-spacing="-3">fernweh</text>
    <text x="66" y="206" fill="#d2e2ed" font-size="25">Your workstation. Wherever you work.</text>
    <text x="66" y="266" fill="#8dabc0" font-size="16">Creative workflows · thoughtful display tools · optional studio access</text>
  </g>
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M834 127C773 127 794 237 853 237H1059" stroke="#75bde6" stroke-width="2" stroke-dasharray="5 8" fill="none"/>
    <rect x="867" y="59" width="248" height="146" rx="9" fill="#0f1c29" stroke="#75bde6" stroke-width="2"/>
    <rect x="878" y="70" width="226" height="123" rx="3" fill="url(#screen)"/>
    <path d="M911 157L962 106L999 143L1024 118L1071 165" fill="none" stroke="#89c9ed" stroke-opacity=".7" stroke-width="2"/>
    <path d="M978 206V223M953 223H1005" stroke="#6993ad" stroke-width="3"/>
    <rect x="1060" y="166" width="112" height="127" rx="6" fill="#101e2b" stroke="#6495b4" stroke-width="2"/>
    <rect x="1069" y="176" width="94" height="105" rx="2" fill="url(#screen)"/>
    <rect x="837" y="237" width="179" height="63" rx="6" fill="#152737" stroke="#6f9db9" stroke-width="2"/>
    <path d="M820 302H1032L1021 309H831Z" fill="#253f53" stroke="#6f9db9"/>
    <circle cx="834" cy="127" r="5" fill="#dca76a" stroke="#1c2b38" stroke-width="3"/>
    <circle cx="1059" cy="237" r="5" fill="#dca76a" stroke="#1c2b38" stroke-width="3"/>
  </g>
</svg>
