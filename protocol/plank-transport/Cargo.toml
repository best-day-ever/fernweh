[package]
name = "plank-transport"
version = "1.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[features]
default = []
quinn-bbr = ["quinn-proto/plank-bbr-default"]
quinn-telemetry = ["kynet/quinn-telemetry"]
sender-timing = ["kynet/sender-timing", "kyproto/sender-timing"]

[dependencies]
anyhow = "1.0"
bytes = "1.10"
hex = "0.4"
kynet = { path = "../../third_party/kyber-kymux/kynet", features = ["kynet-quinn"] }
kyproto = { path = "../../third_party/kyber-kymux/kyproto" }
kymux-types = { path = "../../third_party/kyber-kymux/kymux-types" }
quinn-proto = { version = "=0.11.19", default-features = false }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
# Enable the same socket contract for Kynet and the native listener's runtime.
quinn-udp = { version = "=0.5.16", default-features = false, features = ["plank-bounded-receive-buffer"] }
ring = "0.17"
rustls = { version = "0.23.46", default-features = false, features = ["logging", "std", "tls12"] }
subtle = "2.6"
socket2 = "0.6"
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "0.2"

[patch.crates-io]
# Keep the same Quinn release with PLANK telemetry shared by production and the
# standalone probes. See third_party/quinn-proto-0.11.19/PLANK-PATCH.md.
quinn-proto = { path = "../../third_party/quinn-proto-0.11.19" }
quinn-udp = { path = "../../third_party/quinn-udp-0.5.16" }
